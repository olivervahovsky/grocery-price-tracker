name: Build Windows release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build executable
        shell: cmd
        run: |
          python -m pip install -r requirements-build.txt
          python -m PyInstaller --noconfirm --clean GroceryTracker.spec
          if not exist dist\GroceryTracker.exe exit /b 1
      - name: Attach executable to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:RELEASE_TAG" dist/GroceryTracker.exe
